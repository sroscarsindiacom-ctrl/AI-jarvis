<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Nandu</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="./style.css">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- HTML Sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <!-- Highlight.js -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>

    <style>
        /* =====================================================
           BASIC FALLBACK UI
           This prevents the page from becoming raw HTML
           if style.css has not loaded correctly.
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #020914;
            color: #ffffff;
            overflow: hidden;
        }

        button,
        textarea,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 65% 35%,
                    rgba(35, 90, 180, 0.10),
                    transparent 38%
                ),
                #020914;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 320px;
            min-width: 320px;
            height: 100vh;
            background:
                linear-gradient(
                    180deg,
                    #030c18,
                    #020914
                );
            border-right: 1px solid rgba(100, 150, 220, 0.18);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
            position: relative;
            z-index: 20;
        }

        .sidebar-top {
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 28px;
        }

        .logo-img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            border-radius: 50%;
            filter:
                drop-shadow(
                    0 0 18px rgba(45, 120, 255, .55)
                );
        }

        .brand span {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
        }

        .new-chat {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 14px;
            background:
                linear-gradient(
                    135deg,
                    #287cff,
                    #6748ff
                );
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            box-shadow:
                0 10px 30px rgba(48, 105, 255, .28);
        }

        .new-chat:hover {
            transform: translateY(-1px);
        }

        .chat-history {
            margin-top: 28px;
            flex: 1;
            overflow-y: auto;
        }

        .history-title {
            color: #77869b;
            font-size: 13px;
            margin-bottom: 10px;
        }

        #history-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .history-item {
            width: 100%;
            border: 0;
            background: rgba(10, 27, 48, .65);
            color: #dce7f8;
            border-radius: 10px;
            padding: 11px;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item:hover {
            background: rgba(24, 55, 95, .75);
        }

        .sidebar-bottom {
            border-top: 1px solid rgba(100, 150, 220, .14);
            padding-top: 18px;
        }

        .side-button {
            width: 100%;
            border: 0;
            background: transparent;
            color: #b9c6d8;
            text-align: left;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .side-button:hover {
            background: rgba(255,255,255,.06);
            color: #ffffff;
        }

        .model-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #91a0b4;
            font-size: 13px;
            padding: 12px;
        }

        .status-dot,
        .online-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            box-shadow: 0 0 10px rgba(34,197,94,.6);
        }

        /* ================= MAIN ================= */

        .main {
            flex: 1;
            min-width: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(26, 74, 145, .08),
                    transparent 45%
                );
        }

        .topbar {
            height: 90px;
            min-height: 90px;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 28px;
            border-bottom: 1px solid rgba(90, 135, 200, .14);
            background: rgba(2, 9, 18, .78);
            backdrop-filter: blur(18px);
        }

        .menu-btn {
            display: none;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(80,130,220,.25);
            background: rgba(10,25,45,.8);
            color: #ffffff;
            border-radius: 10px;
            font-size: 20px;
        }

        .top-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
        }

        .top-status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #94a3b8;
            font-size: 13px;
        }

        .chat-area {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px;
        }

        /* ================= WELCOME ================= */

        .welcome {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 35px 20px;
        }

        .welcome-icon img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 50%;
            filter:
                drop-shadow(
                    0 0 30px rgba(45,125,255,.55)
                );
        }

        .welcome h1 {
            font-size: 42px;
            margin: 20px 0 8px;
            color: #ffffff;
        }

        .welcome p {
            margin: 0 0 25px;
            font-size: 20px;
            color: #8998ad;
        }

        .suggestions {
            width: min(800px, 100%);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .suggestion {
            min-height: 135px;
            padding: 17px;
            border: 1px solid rgba(90,135,210,.22);
            background: rgba(4,15,28,.78);
            border-radius: 15px;
            color: #ffffff;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .suggestion:hover {
            border-color: rgba(80,145,255,.55);
            background: rgba(10,30,55,.85);
        }

        .suggestion > span {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .suggestion strong {
            color: #4f91ff;
            font-size: 17px;
        }

        .suggestion small {
            color: #a2afc0;
            line-height: 1.4;
        }

        /* ================= INPUT ================= */

        .input-section {
            padding: 14px 28px 20px;
        }

        .attachment-preview {
            min-height: 0;
            color: #bcd4f8;
            margin-bottom: 7px;
        }

        .input-wrapper {
            min-height: 70px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 18px;
            border: 1px solid rgba(80,130,205,.22);
            background: rgba(7,17,30,.9);
            box-shadow:
                inset 0 0 25px rgba(0,0,0,.12);
        }

        .tool-btn {
            width: 45px;
            height: 45px;
            min-width: 45px;
            border: 0;
            border-radius: 50%;
            background: rgba(18,38,64,.85);
            color: #ffffff;
            font-size: 25px;
        }

        .tool-btn:hover {
            background: rgba(37,76,125,.9);
        }

        #user-input {
            flex: 1;
            min-width: 0;
            max-height: 160px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: #ffffff;
            font-size: 16px;
            line-height: 1.5;
            padding: 12px 5px;
        }

        #user-input::placeholder {
            color: #718198;
        }

        .send-btn,
        #send-btn {
            width: 56px;
            height: 56px;
            min-width: 56px;
            border: 0;
            border-radius: 50%;
            background:
                linear-gradient(
                    135deg,
                    #287cff,
                    #704cff
                );
            color: #ffffff;
            font-size: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 8px 28px rgba(46,105,255,.35);
        }

        .send-btn:hover,
        #send-btn:hover {
            transform: scale(1.04);
        }

        .stop-btn,
        #stop-btn {
            width: 56px;
            height: 56px;
            min-width: 56px;
            border: 0;
            border-radius: 50%;
            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #b91c1c
                );
            color: #ffffff;
            font-size: 18px;
        }

        .hidden {
            display: none !important;
        }

        .input-info {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 10px;
        }

        /* ================= MESSAGE ================= */

        .message-row {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 18px;
        }

        .message-inner {
            display: flex;
            gap: 11px;
            align-items: flex-start;
        }

        .avatar {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-avatar {
            background: rgba(55,95,180,.3);
        }

        .bot-avatar {
            background: rgba(30,89,180,.2);
        }

        .bot-avatar img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .message-content {
            max-width: calc(100% - 55px);
            color: #edf3ff;
            line-height: 1.65;
        }

        .user-content {
            padding: 12px 16px;
            border-radius: 16px;
            background:
                linear-gradient(
                    135deg,
                    #1458c8,
                    #5638cc
                );
            color: #ffffff;
        }

        .markdown-content pre {
            overflow-x: auto;
        }

        .message-actions {
            display: flex;
            gap: 7px;
            margin: 8px 0 0 49px;
        }

        .action-btn {
            border: 1px solid #334155;
            background: #111e30;
            color: #dbeafe;
            border-radius: 7px;
            padding: 6px 10px;
        }

        .sources {
            margin: 10px 0 0 49px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .sources strong {
            color: #8eb8ff;
        }

        .sources a {
            color: #74a9ff;
            text-decoration: none;
        }

        /* ================= CODE ================= */

        .code-container {
            border: 1px solid rgba(86,127,190,.28);
            border-radius: 12px;
            overflow: hidden;
            background: #030914;
            margin: 12px 0;
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 11px;
            background: #0b1728;
            color: #8da1ba;
            font-size: 12px;
        }

        .copy-code-btn {
            border: 1px solid #334155;
            background: #111e30;
            color: #dbeafe;
            border-radius: 7px;
            padding: 4px 9px;
            cursor: pointer;
        }

        .typing {
            display: flex;
            gap: 5px;
            padding: 10px;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #5f9cff;
            animation: typing 1s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .30s;
        }

        @keyframes typing {
            0%, 80%, 100% {
                opacity: .3;
                transform: translateY(0);
            }

            40% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }

        .error-box {
            color: #fecaca;
            background: rgba(127,29,29,.25);
            border: 1px solid rgba(248,113,113,.25);
            border-radius: 10px;
            padding: 12px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 280px;
                min-width: 280px;
            }

            .suggestions {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {

            body {
                overflow: hidden;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 285px;
                min-width: 285px;
                z-index: 7000;
                transform: translateX(-105%);
                transition: transform .25s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-btn {
                display: block;
            }

            .topbar {
                height: 70px;
                min-height: 70px;
                padding: 0 15px;
            }

            .chat-area {
                padding: 12px;
            }

            .input-section {
                padding: 10px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 32px;
            }

            .welcome p {
                font-size: 17px;
            }

            .input-wrapper {
                border-radius: 15px;
            }

            .send-btn,
            #send-btn,
            .stop-btn,
            #stop-btn {
                width: 50px;
                height: 50px;
                min-width: 50px;
            }

            .tool-btn {
                width: 42px;
                height: 42px;
                min-width: 42px;
            }

            .message-content {
                max-width: calc(100% - 48px);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="brand">
                <img
                    src="logo.png"
                    class="logo-img"
                    alt="AI Nandu Logo"
                >

                <span>AI Nandu</span>
            </div>


            <button
                id="new-chat-btn"
                class="new-chat"
                type="button"
            >
                <span>＋</span>
                New Chat
            </button>


            <div
                class="chat-history"
                id="chat-history"
            >

                <div class="history-title">
                    Recent Chats
                </div>

                <div id="history-list"></div>

            </div>

        </div>


        <div class="sidebar-bottom">

            <button
                id="clear-chat-btn"
                class="side-button"
                type="button"
            >
                🗑️ Clear Chat
            </button>


            <div class="model-status">

                <span class="status-dot"></span>

                <span>
                    Gemini 2.5 Flash · Online
                </span>

            </div>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">

        <!-- TOP BAR -->

        <header class="topbar">

            <button
                id="menu-btn"
                class="menu-btn"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>


            <div class="top-title">
                <span>AI Nandu</span>
            </div>


            <div class="top-status">

                <span class="online-dot"></span>

                <span>
                    Online
                </span>

            </div>

        </header>


        <!-- =================================================
             CHAT
             ================================================= -->

        <section
            class="chat-area"
            id="chat-box"
        ></section>


        <!-- =================================================
             INPUT
             ================================================= -->

        <div class="input-section">

            <div
                id="attachment-preview"
                class="attachment-preview"
            ></div>


            <div class="input-wrapper">

                <!-- FILE INPUT -->

                <input
                    id="file-input"
                    type="file"
                    hidden
                    accept="image/*,.txt,.md,.json,.csv,.js,.html,.css,.py,.pdf,.doc,.docx,.xls,.xlsx"
                >


                <!-- FUNCTIONS / PLUS -->

                <button
                    id="attach-btn"
                    class="tool-btn functions-btn"
                    type="button"
                    title="Functions"
                    aria-label="Open functions"
                >
                    <span class="plus-icon">
                        ＋
                    </span>
                </button>


                <!-- MESSAGE INPUT -->

                <textarea
                    id="user-input"
                    rows="1"
                    placeholder="Message AI Nandu..."
                    autocomplete="off"
                ></textarea>


                <!-- STOP -->

                <button
                    id="stop-btn"
                    class="stop-btn hidden"
                    type="button"
                    aria-label="Stop generation"
                >
                    ■
                </button>


                <!-- SEND -->

                <button
                    id="send-btn"
                    class="send-btn"
                    type="button"
                    aria-label="Send message"
                >
                    ➤
                </button>

            </div>


            <div class="input-info">
                AI Nandu can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<!-- =========================================================
     FINAL FRONTEND SCRIPT
     IMPORTANT:
     Do NOT add another inline JavaScript block here.
     script.js handles Functions, Camera, Settings, Chat,
     History, Send, Stop, etc.
     ========================================================= -->

<script src="./script.js"></script>

</body>
</html>
